name: Daily Brief

on:
  workflow_dispatch:
  schedule:
    # 08:00 America/Chicago (Central Time):
    # - 14:00 UTC during CST (roughly Nov-Mar)
    # - 13:00 UTC during CDT (roughly Mar-Nov)
    - cron: "0 14 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run only at 08:00 Central
        id: central_time_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CENTRAL_HOUR=$(TZ=America/Chicago date +%H)
          if [ "$CENTRAL_HOUR" = "08" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.central_time_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.central_time_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ "${{ vars.USE_LLM }}" = "true" ]; then
            python -m pip install -r requirements-llm.txt
          fi

      - name: Generate brief
        if: steps.central_time_gate.outputs.should_run == 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          REGION_NAME: ${{ vars.REGION_NAME }}
          OUTPUT_DIR: output
          SITE_DIR: docs
          BASE_REVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/briefs
          SEND_EMAIL: ${{ vars.SEND_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_TO: ${{ vars.EMAIL_TO }}
          REPLY_TO: ${{ vars.REPLY_TO }}
          EMAIL_CC: ${{ vars.EMAIL_CC }}
          USE_LLM: ${{ vars.USE_LLM }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          python python_code.py

      - name: Commit generated files
        if: steps.central_time_gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs output
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: generate daily brief"
            git push
          fi
