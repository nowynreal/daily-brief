<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Brief Archive</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root {
      --bg-1: #f8fafc;
      --bg-2: #f1f5f9;
      --ink: #1e293b;
      --muted: #475569;
      --panel: rgba(255, 255, 255, 0.94);
      --line: #dbe3ee;
      --accent: #0b3a5e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: 'IBM Plex Sans', sans-serif;
      background:
        radial-gradient(900px 450px at 100% -10%, #dde6f3 0%, transparent 62%),
        linear-gradient(170deg, var(--bg-1), var(--bg-2));
      min-height: 100vh;
    }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 1.2rem 1rem 2rem;
    }

    .hero {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      margin-bottom: 1.5rem;
    }

    .hero .accent {
      font-family: 'IBM Plex Sans', sans-serif;
      font-style: normal;
      font-size: 0.65em;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      font-family: 'Fraunces', serif;
      font-size: clamp(1.5rem, 2.5vw, 2rem);
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.2rem;
    }

    .brief-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .brief-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 1.4rem;
      transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1.2rem;
      align-items: start;
    }

    .brief-card:hover {
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(11, 58, 94, 0.12);
      transform: translateY(-2px);
    }

    .brief-meta {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .brief-date {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.4;
    }

    .brief-signal-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .signal-badge {
      display: inline-block;
      padding: 0.5rem 0.9rem;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .signal-badge.stable {
      background: #d1fae5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    .signal-badge.moderate {
      background: #fed7aa;
      color: #92400e;
      border: 1px solid #fdba74;
    }

    .signal-badge.elevated {
      background: #fecaca;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }

    .brief-alerts {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 13px;
      color: var(--muted);
      background: #f8fafc;
      padding: 0.5rem 0.8rem;
      border-radius: 7px;
      border: 1px solid #e2e8f0;
    }

    .alert-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #334155;
      flex-shrink: 0;
    }

    .brief-alerts strong {
      font-weight: 700;
      color: var(--ink);
    }

    .brief-actions {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: flex-end;
    }

    .brief-btn {
      display: inline-block;
      padding: 0.75rem 1.4rem;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), #1d4f75);
      border: none;
      border-radius: 9px;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.24s ease;
      box-shadow: 0 4px 12px rgba(11, 58, 94, 0.18);
      white-space: nowrap;
    }

    .brief-btn:hover {
      background: linear-gradient(135deg, #082a46, #15384a);
      box-shadow: 0 8px 20px rgba(11, 58, 94, 0.28);
      transform: translateY(-2px);
    }

    .brief-btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(11, 58, 94, 0.15);
    }

    .brief-btn:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 2px;
    }

    .footer {
      margin-top: 1.2rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 0.85rem;
    }

    .footer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }

    .footer-brand {
      font-size: 0.94rem;
      color: #334155;
    }

    .footer-list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
    }

    .footer-list li {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .footer-list a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: color 0.18s ease, border-color 0.18s ease, transform 0.18s ease;
    }

    .footer-list a:hover {
      color: #082a46;
      border-bottom-color: var(--accent);
      transform: translateY(-1px);
    }

    .footer-list a:focus-visible {
      outline: 2px solid #93c5fd;
      outline-offset: 3px;
      border-radius: 2px;
    }

    .link-icon {
      color: #64748b;
      font-size: 0.74rem;
      line-height: 1;
    }

    @media (max-width: 768px) {
      .brief-card {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .brief-actions {
        align-items: flex-start;
      }

      .brief-btn {
        width: 100%;
        text-align: center;
      }
    }

    @media (max-width: 640px) {
      main {
        padding: 0.85rem 0.65rem 1.5rem;
      }

      .panel {
        padding: 1rem;
      }

      .brief-card {
        padding: 1.1rem;
      }

      .footer {
        padding: 0.72rem;
      }

      .footer-top {
        flex-direction: column;
        align-items: flex-start;
      }

      .brief-alerts {
        font-size: 12px;
        padding: 0.4rem 0.7rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <h1>BERC Daily Briefer<span class="accent"> by Semih Yucekan</span></h1>
    </section>

    <div class="panel">
      <div class="brief-cards">
        <div class="brief-card">
          <div class="brief-meta">
            <div class="brief-date">April 2, 2026</div>
            <div class="brief-signal-group">
              <span class="signal-badge stable">Stable to mixed</span>
              <div class="brief-alerts">
                <span class="alert-count">0</span>
                <span><strong>0 alerts</strong> triggered</span>
              </div>
            </div>
          </div>
          <div class="brief-actions">
            <a href="briefs/2026-04-02.html" class="brief-btn">Review Full Brief</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-top">
        <div class="footer-brand"><strong>BERC Daily Briefer</strong> | Semih Yucekan</div>
        <nav aria-label="BERC links">
          <ul class="footer-list">
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://www.mtsu.edu/" target="_blank" rel="noopener noreferrer">MTSU</a></li>
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://www.mtsu.edu/berc/" target="_blank" rel="noopener noreferrer">BERC</a></li>
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://urp.mtsu.edu/" target="_blank" rel="noopener noreferrer">COE-URP</a></li>
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://www.mtsu.edu/give/" target="_blank" rel="noopener noreferrer">Donate BERC</a></li>
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://www.instagram.com/mtsublueraiders/" target="_blank" rel="noopener noreferrer">Instagram</a></li>
            <li><span class="link-icon" aria-hidden="true">&#8599;</span><a href="https://www.linkedin.com/school/middle-tennessee-state-university/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
          </ul>
        </nav>
      </div>
    </footer>
  </main>
</body>
</html>
